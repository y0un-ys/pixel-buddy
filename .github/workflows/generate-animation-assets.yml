name: Generate chibi animation sprites

on:
  push:
    branches: [dev]
    paths:
      - 'tools/generate_chibi_animations.py'
      - 'assets/illustrations/**'
      - '.github/workflows/generate-animation-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install artwork generator requirements
        run: python -m pip install --disable-pip-version-check Pillow numpy scipy
      - name: Render illustrated character animation atlases
        run: python tools/generate_chibi_animations.py
      - name: Commit sprite atlases to dev
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/animations/
          if git diff --cached --quiet; then
            echo 'Sprites unchanged'
            exit 0
          fi
          git commit -m 'assets(animation): regenerate 5 pet animation atlases [skip ci]'
          git push origin HEAD:dev
