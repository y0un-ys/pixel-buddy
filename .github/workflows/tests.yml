name: Pixel Buddy tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest cairosvg
      - name: Check source and scene tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q src tests
          python -m pytest -q tests
      - name: Render actual app artwork for visual QA
        run: python tools/preview_cozy_scene.py preview_cozy
      - name: Upload artwork preview
        uses: actions/upload-artifact@v4
        with:
          name: pixel-buddy-cozy-scenes
          path: preview_cozy/
          retention-days: 14
