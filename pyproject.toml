[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-buddy"
version = "0.4.3"
description = "Cozy Korean desktop pet with growth and cosmetics"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "psutil>=6,<9", "pynput>=1.7,<2", "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'", "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'"]

[project.scripts]
pixel-buddy = "pixel_buddy.main:main"

[tool.setuptools.packages.find]
where = ["src"]
